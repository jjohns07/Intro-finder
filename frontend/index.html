<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101014" />
    <script>
      // Apply the saved palette before the first paint. Dark is the default.
      try {
        const preference = localStorage.getItem('introfinder_theme');
        const theme = preference === 'light' || (preference === 'system' && !matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f5f4f1' : '#101014';
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>Intro Finder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
